
# Use database storage instead of JSON repositories
codeverse.storage=db

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/codeverse
spring.datasource.username=codeverse
spring.datasource.password=${CODEVERSE_DB_PASSWORD}

# Hibernate: create/update tables for local development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Socket server enabled for demo
codeverse.socket.enabled=true
